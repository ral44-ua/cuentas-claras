name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar la app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../CuentasClaras.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CuentasClaras-apk
          path: CuentasClaras.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cuentas Claras (versión ${{ github.run_number }})
          body: Descarga CuentasClaras.apk desde el móvil e instálalo.
          files: CuentasClaras.apk
