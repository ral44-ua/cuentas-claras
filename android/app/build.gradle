plugins {
    id 'com.android.application'
}

android {
    namespace 'es.cuentasclaras.app'
    compileSdk 34

    defaultConfig {
        applicationId 'es.cuentasclaras.app'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.0'
    }

    // Clave fija para que cada nueva versión se instale encima de la anterior sin perder datos
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
