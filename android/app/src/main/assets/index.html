<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>@font-face{font-family:"Mona Sans";font-style:normal;font-display:block;font-weight:200 900;font-stretch:75% 125%;src:url(fonts/mona-sans-latin-ext.woff2) format("woff2-variations"),url(fonts/mona-sans-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}@font-face{font-family:"Mona Sans";font-style:normal;font-display:block;font-weight:200 900;font-stretch:75% 125%;src:url(fonts/mona-sans-latin.woff2) format("woff2-variations"),url(fonts/mona-sans-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}</style>
</head>
<body>
<title>Cuentas Claras</title>
<style>
/* Papel moneda: la app es papel de seguridad, claro y callado; el billete del mes es la única pieza oscura,
   con grabado guilloché propio de cada mes, microtexto y cifras de caja registradora.
   Una columna alineada a la izquierda, barra superior translúcida y pestañas con la acción de añadir en el centro. */
:root{
  --paper:#F1F2F6; --sheet:#FFFFFF; --sheet-2:#F5F6FA; --sheet-3:#EAECF2;
  --rule:#E1E4EC; --rule-2:#CDD2DE;
  --ink:#141A2E; --ink-2:#4A5169; --ink-3:#636A82;
  --azul:#2E46D6; --azul-on:#FFFFFF; --azul-soft:#E5E9FD; --toast-act:#A9B9FF;
  --note:#141C3A; --note-hi:#25316C; --note-ink:#F4F6FF; --note-ink-2:#A9B3DC; --note-track:rgba(255,255,255,.13);
  --grabado:#8C9EF7; --grabado-warn:#F5C45E; --grabado-crit:#FF8F86; --fill-ok:#A9B9FF;
  --good:#0CA30C; --good-ink:#0B7A2A; --good-soft:#E2F3E5;
  --warn:#FAB219; --warn-ink:#8A5A00; --warn-soft:#FFF2D4;
  --crit:#D03B3B; --crit-ink:#B42A2A; --crit-soft:#FBE3E3;
  --gasto:#2E46D6; --ingreso:#7F869C;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948; --s0:#7F869C;
  --tile-k:14%; --tile-fg:#141A2E; --tile-fg-k:70%;
  --behind:#0A0D18; --scrim:rgba(10,13,24,.44);
  --lift:0 1px 2px rgba(20,26,46,.05),0 8px 24px -14px rgba(20,26,46,.22);
  --lift-note:0 2px 6px rgba(20,28,58,.16),0 26px 50px -24px rgba(20,28,58,.6);
  --f:"Mona Sans","Mona Sans Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --e-out:cubic-bezier(.16,1,.3,1); --e-spring:cubic-bezier(.34,1.42,.64,1); --e-sheet:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1220; --sheet:#161B2B; --sheet-2:#1C2234; --sheet-3:#242B40;
  --rule:#262D41; --rule-2:#353D55;
  --ink:#EEF1F8; --ink-2:#AFB6CA; --ink-3:#8890A6;
  --azul:#97A8FF; --azul-on:#0E1220; --azul-soft:#222B55; --toast-act:#2E46D6;
  --note:#19213F; --note-hi:#2B3773; --note-ink:#F4F6FF; --note-ink-2:#A6B0D8; --note-track:rgba(255,255,255,.12);
  --grabado:#7D8FEA; --grabado-warn:#E9B64F; --grabado-crit:#F0837A; --fill-ok:#A9B9FF;
  --good-ink:#3DCB5A; --good-soft:#15301E; --warn-ink:#F2B33A; --warn-soft:#382C12; --crit-ink:#F38282; --crit-soft:#3B1C20;
  --gasto:#97A8FF; --ingreso:#68708A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#68708A;
  --tile-k:24%; --tile-fg:#FFFFFF; --tile-fg-k:76%;
  --behind:#04060C; --scrim:rgba(0,0,0,.56);
  --lift:0 0 0 1px rgba(255,255,255,.035),0 10px 26px -16px rgba(0,0,0,.7);
  --lift-note:0 0 0 1px rgba(255,255,255,.07),0 26px 50px -26px rgba(0,0,0,.85);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E1220; --sheet:#161B2B; --sheet-2:#1C2234; --sheet-3:#242B40;
  --rule:#262D41; --rule-2:#353D55;
  --ink:#EEF1F8; --ink-2:#AFB6CA; --ink-3:#8890A6;
  --azul:#97A8FF; --azul-on:#0E1220; --azul-soft:#222B55; --toast-act:#2E46D6;
  --note:#19213F; --note-hi:#2B3773; --note-ink:#F4F6FF; --note-ink-2:#A6B0D8; --note-track:rgba(255,255,255,.12);
  --grabado:#7D8FEA; --grabado-warn:#E9B64F; --grabado-crit:#F0837A; --fill-ok:#A9B9FF;
  --good-ink:#3DCB5A; --good-soft:#15301E; --warn-ink:#F2B33A; --warn-soft:#382C12; --crit-ink:#F38282; --crit-soft:#3B1C20;
  --gasto:#97A8FF; --ingreso:#68708A;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#68708A;
  --tile-k:24%; --tile-fg:#FFFFFF; --tile-fg-k:76%;
  --behind:#04060C; --scrim:rgba(0,0,0,.56);
  --lift:0 0 0 1px rgba(255,255,255,.035),0 10px 26px -16px rgba(0,0,0,.7);
  --lift-note:0 0 0 1px rgba(255,255,255,.07),0 26px 50px -26px rgba(0,0,0,.85);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--behind);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5;font-stretch:100%;font-weight:420;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:620}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- iconos ---------- */
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i .f{fill:currentColor;stroke:none}

/* ---------- armazón ---------- */
#app{position:fixed;inset:0;background:var(--paper);overflow:hidden;transform-origin:50% 0;transition:transform .55s var(--e-sheet),border-radius .55s var(--e-sheet)}
body.sheet-on #app{transform:translateY(calc(env(safe-area-inset-top,0px) + 12px)) scale(.94);border-radius:26px}
.bar{position:absolute;z-index:20;top:0;left:0;right:0;padding-top:env(safe-area-inset-top,0px);transition:background-color .25s,box-shadow .25s}
.bar.scrolled{background:color-mix(in srgb,var(--paper) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 1px 0 var(--rule)}
.bar-in{height:56px;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:4px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.monthsw{display:flex;align-items:center;gap:2px;flex:1;min-width:0;margin-left:-10px}
.month{height:40px;padding:0 6px;border-radius:12px;display:flex;align-items:baseline;gap:7px;overflow:hidden;position:relative;white-space:nowrap}
.month .mv{display:inline-flex;align-items:baseline;gap:7px}
.month .mn{font-size:18px;font-stretch:125%;font-weight:660;letter-spacing:-.015em}
.month .my{font-size:15px;color:var(--ink-3);font-weight:500}
.bar-title{flex:1;min-width:0;font-size:18px;font-stretch:125%;font-weight:660;letter-spacing:-.015em;opacity:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none;position:relative;overflow:hidden}
.ib.end{margin-right:-10px}
.today{height:32px;padding:0 12px;border-radius:10px;background:var(--azul-soft);color:var(--azul);font-size:14px;font-weight:620;margin-right:4px;position:relative;overflow:hidden}
.stage{position:absolute;inset:0;z-index:1}
.page{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}
.wrap>*{flex-shrink:0}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:30px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(68px + env(safe-area-inset-top,0px)) calc(116px + env(safe-area-inset-bottom,0px))}
.tabs{position:absolute;z-index:20;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);
  background:color-mix(in srgb,var(--sheet) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);box-shadow:0 -1px 0 var(--rule)}
.tabs-in{position:relative;height:68px;max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{position:relative;overflow:hidden;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:560;color:var(--ink-3);transition:color .25s;white-space:nowrap}
.tab .i{width:24px;height:24px;transition:color .25s}
.tab span{font-stretch:92%}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .i{color:var(--azul);stroke-width:2}
.tab-ind{position:absolute;z-index:0;top:8px;left:0;width:58px;height:30px;border-radius:15px;background:var(--azul-soft);will-change:transform}
.add{justify-self:center;width:56px;height:56px;border-radius:20px;background:var(--azul);color:var(--azul-on);display:grid;place-items:center;position:relative;overflow:hidden;
  box-shadow:0 10px 22px -10px color-mix(in srgb,var(--azul) 80%,transparent);transition:transform .45s var(--e-spring)}
.add .i{width:26px;height:26px;stroke-width:2.2}
.add:active{transform:scale(.9)}
.add:disabled{opacity:.5}

/* ---------- tipografía ---------- */
.ttl{font-size:36px;line-height:1.05;font-stretch:125%;font-weight:680;letter-spacing:-.025em;text-wrap:balance}
.ttl-sub{font-size:16px;color:var(--ink-3);margin-top:8px;max-width:40ch}
.h2{font-size:21px;line-height:1.2;font-stretch:112.5%;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.h3{font-size:clamp(21px,6.2vw,24px);line-height:1.15;font-stretch:125%;font-weight:670;letter-spacing:-.02em;text-wrap:balance}
.sub{font-size:14px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.p{font-size:16px;color:var(--ink-2);line-height:1.55;max-width:60ch}
.p b{color:var(--ink)}
.hint{font-size:14px;color:var(--ink-3);line-height:1.5}
.hint b{color:var(--ink-2)}
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec-h .tot{font-size:16px;font-weight:650;white-space:nowrap}
.lab{font-size:14px;font-weight:560;color:var(--ink-2)}
.neg{color:var(--crit-ink)} .pos{color:var(--good-ink)}

/* ---------- billete ---------- */
.note{position:relative;isolation:isolate;overflow:hidden;border-radius:26px;color:var(--note-ink);
  background:radial-gradient(130% 95% at 100% 0%,var(--note-hi) 0%,var(--note) 60%);box-shadow:var(--lift-note);
  padding:20px 20px 0;display:flex;flex-direction:column;gap:16px;--g:var(--grabado)}
.note[data-state="warn"]{--g:var(--grabado-warn)}
.note[data-state="crit"]{--g:var(--grabado-crit)}
.engrave{position:absolute;z-index:-1;width:min(118%,580px);aspect-ratio:1;right:-38%;top:-52%;opacity:.62;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 42%,rgba(0,0,0,.35) 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 42%,rgba(0,0,0,.35) 72%,transparent 100%)}
.engrave path{fill:none;stroke:var(--g);stroke-width:.42;transition:stroke .9s var(--e-out)}
.engrave .core{stroke-width:.36;opacity:.9}
.engrave.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:engrave 2s var(--e-out) forwards;animation-delay:calc(var(--d) * 32ms)}
@keyframes engrave{to{stroke-dashoffset:0}}
.note-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.note-label{font-size:15px;font-weight:540;color:var(--note-ink-2)}
.serial{font-size:12px;letter-spacing:.14em;color:var(--note-ink-2);opacity:.8;white-space:nowrap}
.note-mid{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.amount{font-size:clamp(46px,14.5vw,62px);line-height:1;font-stretch:125%;font-weight:680;letter-spacing:-.03em;display:inline-flex;align-items:flex-start;white-space:nowrap}
.odo-col{display:inline-block;height:1em;overflow:hidden;text-align:center;transition:width .7s var(--e-out)}
.odo-strip{display:flex;flex-direction:column;transform:translateY(calc(var(--n,0) * -1em))}
.odo-strip>span{height:1em;line-height:1em}
.odo-strip.go{transition:transform 1.15s cubic-bezier(.2,.85,.15,1)}
.odo-sep{display:inline-block;height:1em;line-height:1em}
.odo-c{display:inline-flex;font-size:.42em;margin-top:.1em;letter-spacing:0;opacity:.88}
.odo-cur{font-size:.42em;font-weight:520;margin-left:.3em;margin-top:.1em;letter-spacing:0;opacity:.72;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:15px;font-size:14px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.1);color:var(--note-ink)}
.chip .i{width:16px;height:16px;stroke-width:2.2}
.chip.warn{background:rgba(250,178,25,.18);color:#FFD27A}
.chip.crit{background:rgba(255,120,110,.18);color:#FFB1A9}
.chip.good{background:rgba(110,220,140,.16);color:#9EEDB2}
.ruler{position:relative;padding-bottom:22px}
.ruler-track{position:relative;height:10px;border-radius:6px;background:var(--note-track);overflow:hidden}
.ruler-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:var(--fill-ok);transition:background-color .6s}
.ruler-fill.go{transition:width 1.25s var(--e-out),background-color .6s}
.note[data-state="warn"] .ruler-fill{background:var(--warn)}
.note[data-state="crit"] .ruler-fill{background:var(--crit)}
.ruler-ticks{position:absolute;left:0;right:0;top:14px;height:5px;background:linear-gradient(90deg,rgba(255,255,255,.26) 1px,transparent 1px) 0 0/10% 100% repeat-x;box-shadow:inset -1px 0 rgba(255,255,255,.26)}
.ruler-mark{position:absolute;top:-3px;width:2px;height:16px;border-radius:1px;background:rgba(255,255,255,.7);margin-left:-1px}
.ruler-mark span{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--note-ink-2);white-space:nowrap}
.note-foot{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--note-ink-2);flex-wrap:wrap}
.note-foot b{color:var(--note-ink);font-weight:620}
.micro{margin:0 -20px;padding:7px 20px 8px;border-top:1px solid rgba(255,255,255,.08);font-size:5.5px;line-height:1;letter-spacing:.12em;white-space:nowrap;overflow:hidden;color:var(--note-ink-2);opacity:.55;user-select:none}
.note .h2{color:var(--note-ink);max-width:22ch}
.note .p{color:var(--note-ink-2)}
.note .inp{background:rgba(255,255,255,.09);color:var(--note-ink);border-color:transparent}
.note .inp::placeholder{color:var(--note-ink-2);opacity:.8}
.note .inp:focus{background:rgba(255,255,255,.14);border-color:var(--fill-ok);box-shadow:0 0 0 4px rgba(169,185,255,.18)}
.note .btn.pri{background:var(--note-ink);color:var(--note)}
.note .btn.ghost{color:var(--note-ink);padding:0}
.note .money::after{color:var(--note-ink-2)}
.note-form{display:flex;flex-direction:column;gap:12px;padding-bottom:8px}
.note-form .row2{display:flex;gap:10px}
.note-form .money{flex:1;min-width:0}
.note-form .row2 .btn{height:56px}
.insight{font-size:16px;color:var(--ink-2);line-height:1.55;margin-top:-12px;max-width:60ch}
.insight b{color:var(--ink);font-weight:620}
.insight b.neg{color:var(--crit-ink)}

/* ---------- franja de totales ---------- */
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.strip>div{padding:14px 10px 15px 0;display:flex;flex-direction:column;gap:4px;min-width:0}
.strip>div+div{padding-left:14px;border-left:1px solid var(--rule)}
.strip .l{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:7px;white-space:nowrap}
.strip .l i{width:12px;height:3px;border-radius:2px;background:var(--k)}
.strip .v{font-size:21px;line-height:1.15;font-stretch:112.5%;font-weight:650;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- gráficos ---------- */
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart .ax{font-size:11px;fill:var(--ink-3)}
.chart .ax.cur{fill:var(--ink);font-weight:650}
.chart .grid{stroke:var(--rule);stroke-width:1;shape-rendering:crispEdges}
.chart .base{stroke:var(--rule-2);stroke-width:1;shape-rendering:crispEdges}
.chart .ln{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chart .ln.g{stroke:var(--gasto)} .chart .ln.v{stroke:var(--s1)} .chart .ln.n{stroke:var(--ingreso);stroke-width:1.75}
.chart .ar{stroke:none;fill-opacity:.1} .chart .ar.g{fill:var(--gasto)} .chart .ar.v{fill:var(--s1)}
.chart .thr{stroke:var(--ink-3);stroke-width:1.25;stroke-dasharray:4 4;fill:none}
.chart .proj{stroke:var(--gasto);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round;opacity:.6;fill:none}
.chart .dot{stroke:var(--paper);stroke-width:2} .chart .dot.g{fill:var(--gasto)} .chart .dot.v{fill:var(--s1)}
.chart .lb{font-size:12px;font-weight:650;fill:var(--ink)}
.chart .lb2{font-size:11px;fill:var(--ink-3)}
.chart .lb2.crit{fill:var(--crit-ink)}
.chart .col{transition:opacity .2s}
.chart .col.ci{fill:var(--ingreso)} .chart .col.cg{fill:var(--gasto)}
.chart .dim .col{opacity:.32}
.chart .cross{stroke:var(--ink-3);stroke-width:1;opacity:0;transition:opacity .15s;shape-rendering:crispEdges}
.chart .hot{opacity:0;transition:opacity .15s}
.chart.touch .cross,.chart.touch .hot{opacity:1}
.chart.anim .ln,.chart.anim .proj-in{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--e-out) .1s forwards}
.chart.anim .ar{opacity:0;animation:fade .9s ease .55s forwards}
.chart.anim .dot.end{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .55s var(--e-spring) 1s forwards}
.chart.anim .lb.end,.chart.anim .lb2.end{opacity:0;animation:fade .4s ease 1.15s forwards}
.chart.anim .proj{opacity:0;animation:fade60 .5s ease 1s forwards}
.chart.anim .col{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow .8s var(--e-out) forwards;animation-delay:calc(var(--i) * 50ms + 60ms)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes fade60{to{opacity:.6}}
@keyframes pop{to{transform:scale(1)}}
@keyframes grow{to{transform:scaleY(1)}}

const writing={},dirty={};
function docBody(id){if(id==='config')return state.config;const ym=id.slice(2);const tx=state.months[ym];return tx&&tx.length?{tx}:null}
async function persist(id){
  if(mode!=='cloud'){saveLocal();return}
  if(writing[id]){dirty[id]=true;return}
  writing[id]=true;
  try{do{dirty[id]=false;const body=docBody(id);const ref=db.doc(uidPath+'/'+id);
    if(body)await ref.set(JSON.parse(JSON.stringify(body)));else await ref.delete();}while(dirty[id])}
  catch(e){toast(e&&e.code==='quota_exceeded'?'Se ha llenado el espacio de guardado. Exporta una copia y borra meses antiguos.':'No se pudo guardar. Revisa tu conexión.')}
  finally{writing[id]=false}
}
const saveConfig=()=>persist('config');
const saveMonth=ym=>persist('m-'+ym);

async function initStorage(){
  if(ANDROID){mode='android';loadLocal();return finishLoad()}
  if(!(window.claude&&window.claude.use)){mode='local';loadLocal();return finishLoad()}
  try{
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const id=u?await u.id():null;
    if(!d||!id){mode='local';loadLocal();return finishLoad()}
    db=d;uidPath='data/users/'+id;mode='cloud';
    let first=true;const t=setTimeout(()=>{if(first){first=false;finishLoad()}},5000);
    db.collection(uidPath).onSnapshot(snap=>{
      if(first&&snap.metadata.fromCache&&snap.empty)return;
      const months={};let cfg=null;
      for(const doc of snap.docs){const data=doc.data();if(!data)continue;
        if(doc.id==='config')cfg=data;else if(doc.id.startsWith('m-'))months[doc.id.slice(2)]=Array.isArray(data.tx)?data.tx.slice():[];}
      state.config=Object.assign(defaultConfig(),cfg?JSON.parse(JSON.stringify(cfg)):{});
      state.months=JSON.parse(JSON.stringify(months));
      if(first){first=false;clearTimeout(t);finishLoad()}else refresh();
    },err=>{if(first){first=false;clearTimeout(t);mode='local';loadLocal();finishLoad()}else toast('Se perdió la conexión con tus datos guardados')});
  }catch(e){mode='local';loadLocal();finishLoad()}
}
function finishLoad(){ready=true;$('#fab').disabled=false;const r=importPending();go('resumen',{dir:0});

/* ---------- cálculos ---------- */
const catById=id=>state.config.cats.find(c=>c.id===id);

const catName=id=>(catById(id)||{}).name||'Sin categoría';
function fixedFor(ym){return state.config.fixed.filter(f=>f.start<=ym&&(!f.end||ym<=f.end))}
function monthStats(ym,months=state.months){
  const tx=months[ym]||[];const fx=fixedFor(ym);
  let varSpent=0,income=0;const byCat={};
  for(const t of tx){if(t.t==='i')income+=t.amt;else{varSpent+=t.amt;byCat[t.cat]=(byCat[t.cat]||0)+t.amt}}
  let fixedTotal=0;for(const f of fx){fixedTotal+=f.amt;byCat[f.cat]=(byCat[f.cat]||0)+f.amt}
  return{tx,fx,varSpent:r2(varSpent),fixedTotal:r2(fixedTotal),spent:r2(varSpent+fixedTotal),income:r2(income),byCat};
}
function thresholds(){const w=+state.config.warnPct||80;return [...new Set([w,90,100])].filter(x=>x<=100).sort((a,b)=>a-b)}
function reached(spent,budget){if(!budget)return 0;const p=spent/budget*100;let r=0;for(const t of thresholds())if(p>=t)r=t;return r}
function catReached(spent,limit){if(!limit)return 0;const p=spent/limit*100;const w=+state.config.warnPct||80;return p>=100?100:p>=w?w:0}
function invAt(inv,date){
  const es=(inv.e||[]).filter(x=>x.d<=date).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.k===b.k?0:a.k==='v'?1:-1));
  let contrib=0,value=0;for(const x of es){if(x.k==='a'){contrib+=x.amt;value+=x.amt}else value=x.amt}
  return{contrib:r2(contrib),value:r2(value)};
}

function vResumen(){

      <div class="note-foot"><span>Gastado <b class="tnum">${fmt(s.spent)}</b>, ${Math.floor(p)} %</span><span>Límite <b class="tnum">${fmt0(b)}</b></span></div>

      <div class="band${doBand?' anim':''}" role="img" aria-label="Reparto del gasto por categoría">${entries.map(([id,v])=>`<i style="--c:${catVar(id)};--w:${v.toFixed(2)}"></i>`).join('')}</div>
      <div class="rank">${entries.map(([id,v])=>{const cat=catById(id);const lim=cat&&cat.limit;const lp=lim?v/lim*100:0;const lc=lp>=100?'crit':lp>=c.warnPct?'warn':'';
        return `<div class="rk">${tile(catVar(id),catIconHTML(cat))}<span class="rk-n">${esc(catName(id))}</span><span class="rk-a">${fmt0(v)}</span>
          <div class="rk-b">${mtrHTML('rk-'+id,v/maxv*100,'',catVar(id))}<small>${Math.round(v/total*100)} %</small></div>
          ${lim?`<span class="rk-l ${lc}">${lc?ico(lc==='crit'?'stop':'warn'):''}${Math.round(lp)} % de tu límite de ${fmt0(lim)}</span>`:''}</div>`}).join('')}</div></section>`}
  out+=`<section class="sec"><div class="sec-h"><div><h2 class="h2">Últimos seis meses</h2><p class="sub">Lo que entra y lo que sale cada mes</p></div></div>
    <div class="legend"><span><i class="kb" style="--k:var(--ingreso)"></i>Ingresos</span><span><i class="kb" style="--k:var(--gasto)"></i>Gastos</span></div>
    <div class="chart" data-chart="cols" style="min-height:188px"></div></section>`;

function vInv(){
  const inv=state.config.inv;const t=todayStr();
  let out=`<header><h1 class="ttl">Inversiones</h1><p class="ttl-sub">Lo que aportas y lo que vale tu cartera hoy</p></header>`;
  if(!inv.length)return out+`<section class="empty">${engraving('empty-inv',9)}<h3>Sigue aquí tus inversiones</h3><p>Apunta lo que aportas y, de vez en cuando, su valor actual. Verás cuánto ganas o pierdes y cómo evoluciona tu cartera.</p><button class="btn pri sm" data-act="addinv">${ico('plus')}Añadir inversión</button>${hasExamples()?'':'<button class="btn ghost" data-act="sample">Ver la app con datos de ejemplo</button>'}</section>`;
  let V=0,C=0;const rows=inv.map(i=>{const x=invAt(i,t);V+=x.value;C+=x.contrib;return{i,...x}});
  const g=V-C,gp=C?g/C*100:0;
  out+=exampleNotice();
  out+=`<section class="note" data-state="ok" aria-label="Valor de tu cartera">${engr('cartera',24)}
    <div class="note-top"><span class="note-label">Valor de tu cartera</span><span class="serial">N.º CC${t.slice(2,4)}${t.slice(5,7)}</span></div>
    <div class="note-mid">${odoHTML('cartera',V)}<span class="chip ${g<0?'crit':'good'}">${ico(g<0?'stop':'chart')}${g>=0?'+':'−'}${pct(Math.abs(gp))}</span></div>
    <div class="note-foot"><span>Aportado <b class="tnum">${fmt(C)}</b></span><span>Resultado <b class="tnum">${g>=0?'+':'−'}${fmt(Math.abs(g))}</b></span></div>
    <div class="micro" aria-hidden="true">${microText(['Cuentas Claras','cartera',String(Math.round(V)),'eur'])}</div></section>`;
  out+=`<section class="sec"><div class="sec-h"><div><h2 class="h2">Evolución</h2><p class="sub">Valor de la cartera y dinero aportado, a fin de cada mes</p></div></div>
    <div class="legend"><span><i class="kl" style="--k:var(--s1)"></i>Valor</span><span><i class="kl" style="--k:var(--ingreso)"></i>Aportado</span></div>
    <div class="chart" data-chart="inv" style="min-height:210px"></div></section>`;
  const byType={};for(const r of rows){byType[r.i.type]=(byType[r.i.type]||0)+Math.max(r.value,0)}
  const te=Object.entries(byType).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);const tot=te.reduce((a,[,v])=>a+v,0);
  if(te.length){const maxv=te[0][1];const doBand=shouldAnimate('iband',te.map(e=>e.join(':')).join(','));
    out+=`<section class="sec"><div class="sec-h"><div><h2 class="h2">Distribución</h2><p class="sub">Por tipo de inversión</p></div></div>
      <div class="band${doBand?' anim':''}" role="img" aria-label="Distribución por tipo">${te.map(([k,v])=>`<i style="--c:${slotVar(+k)};--w:${v.toFixed(2)}"></i>`).join('')}</div>
      <div class="rank">${te.map(([k,v])=>`<div class="rk">${tile(slotVar(+k),ico(INV_ICONS[+k]||'dots'))}<span class="rk-n">${esc(INV_TYPES[+k]||'Otros')}</span><span class="rk-a">${fmt0(v)}</span><div class="rk-b">${mtrHTML('it-'+k,v/maxv*100,'',slotVar(+k))}<small>${Math.round(v/tot*100)} %</small></div></div>`).join('')}</div></section>`}
  out+=`<section class="sec"><div class="sec-h"><h2 class="h2">Tus inversiones</h2></div><div class="group">
    ${rows.sort((a,b)=>b.value-a.value).map(r=>{const gg=r.value-r.contrib,pp=r.contrib?gg/r.contrib*100:0;
      return `<button class="row" data-inv="${esc(r.i.id)}">${tile(slotVar(+r.i.type),ico(INV_ICONS[+r.i.type]||'dots'))}<span class="row-m"><span class="row-t">${esc(r.i.name)}</span><span class="row-s"><span class="cn">${esc(INV_TYPES[+r.i.type]||'Otros')}</span>${r.i.ex?'<span class="badge ex">Ejemplo</span>':''}</span></span><span class="row-e"><span class="amt">${fmt(r.value)}</span><small class="${gg<0?'neg':'pos'}">${gg>=0?'+':'−'}${pct(Math.abs(pp))}</small></span></button>`}).join('')}
    <button class="row row-act" data-act="addinv">${tile('var(--azul)',ico('plus'))}<span class="row-m"><span class="row-t">Añadir inversión</span></span></button></div></section>`;
  return out;
}

function go(newView,{dir,mdir}={}){
  if(!ready)return;

function moveIndicator(){

    const sel=$('#pwarn .opt[aria-checked="true"]');const before=reached(monthStats(curYM()).spent,state.config.budget);state.config.budget=r2(n||0);if(sel)state.config.warnPct=+sel.dataset.w;state.config.exBudget=false;

function invDetail(id){
  const i=state.config.inv.find(x=>x.id===id);if(!i)return;const x=invAt(i,todayStr());const g=x.value-x.contrib,gp=x.contrib?g/x.contrib*100:0;
  const hist=(i.e||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
  const lab=e=>e.k==='v'?'Nuevo valor':e.amt<0?'Retirada':'Aportación';
  const icn=e=>e.k==='v'?'pencil':e.amt<0?'upload':'download';
  openSheet(`<div style="display:flex;align-items:center;gap:12px">${tile(slotVar(+i.type),ico(INV_ICONS[+i.type]||'dots'))}<h3 class="h3" style="flex:1;min-width:0">${esc(i.name)}</h3><button class="btn ghost" id="iedit">${ico('pencil')}Editar</button></div>
    <div class="trio"><div><span class="l">Valor</span><span class="v">${fmt0(x.value)}</span></div><div><span class="l">Aportado</span><span class="v">${fmt0(x.contrib)}</span></div><div><span class="l">Resultado</span><span class="v ${g<0?'neg':'pos'}">${g>=0?'+':'−'}${pct(Math.abs(gp))}</span></div></div>
    ${segHTML('ek',[['a','Aportar'],['r','Retirar'],['v','Valor actual']],'a')}
    <div class="grid2"><div class="field"><label for="eamt" id="eamtl">Importe aportado</label><div class="money sm"><input class="inp" id="eamt" inputmode="decimal" placeholder="0,00" autocomplete="off"></div></div><div class="field"><label for="edate">Fecha</label><input class="inp" type="date" id="edate" value="${todayStr()}" style="height:56px"></div></div>
    <button class="btn pri block" id="esave">Apuntar</button>
    <div class="sec"><h4 class="h2" style="font-size:18px">Historial</h4><div class="group">${hist.map((e,k)=>`<div class="row static" data-hk="${k}">${tile(e.k==='v'?'var(--s1)':'var(--ingreso)',ico(icn(e)))}<span class="row-m"><span class="row-t">${lab(e)}</span><span class="row-s">${esc(dayLabel(e.d))}</span></span><span class="row-e" style="flex-direction:row;align-items:center;gap:6px"><span class="amt">${e.k==='v'?'':e.amt<0?'−':'+'}${fmt(Math.abs(e.amt))}</span><button class="ib" data-ek="${k}" aria-label="Borrar este apunte">${ico('close')}</button></span></div>`).join('')}</div></div>`);
  let k='a';segBind($('#ek'),v=>{k=v;$('#eamtl').textContent=v==='v'?'Valor total hoy':v==='r'?'Importe retirado':'Importe aportado'});
  $('#iedit').onclick=()=>invSheet(i.id);
  $('#esave').onclick=()=>{const a=parseNum($('#eamt').value);const d=$('#edate').value||todayStr();if(!(a>=0)||(k!=='v'&&!(a>0))){toast('Escribe un importe');shake($('#eamt').parentNode);return}
    i.e.push(k==='v'?{k:'v',amt:r2(a),d}:{k:'a',amt:r2(k==='r'?-a:a),d});saveConfig();haptic('confirm');refresh();invDetail(i.id);toast('Apuntado')};
  $$('[data-ek]').forEach(b=>b.onclick=()=>{const e=hist[+b.dataset.ek];if(i.e.length<=1){toast('Para quitarla entera, usa Editar y luego Borrar');return}
    const row=b.closest('.row');collapse(row).then(()=>{i.e=i.e.filter(x=>x!==e);saveConfig();refresh();invDetail(i.id);toast('Apunte borrado',{action:()=>{i.e.push(e);saveConfig();refresh();if(sheetOpen)invDetail(i.id)}})})});
}

/* ---------- ajustes, copias, ejemplo ---------- */
function settingsSheet(){
  const where=mode==='android'?'Tus datos se guardan en este móvil y no salen de él.':mode==='cloud'?'Tus datos se guardan en tu cuenta y solo tú puedes verlos.':'Tus datos se guardan solo en este navegador.';
  const auto=ANDROID&&ANDROID.isAutoAllowed;const aOn=state.config.autoPay&&autoAllowed();
  openSheet(`<h3 class="h3">Ajustes</h3>
    <div class="group"><div class="row static">${tile('var(--s3)',ico('shield'))}<span class="row-m"><span class="row-t">Dónde están tus datos</span><span class="row-s" style="white-space:normal">${where}</span></span></div></div>
    <div class="sec"><h4 class="lab">Copia de seguridad</h4><div class="group">
      <button class="row" id="sexp">${tile('var(--s1)',ico('download'))}<span class="row-m"><span class="row-t">Exportar copia</span><span class="row-s">Guarda un archivo con todos tus datos</span></span>${ico('chevR','chev')}</button>
      <label class="row" for="simp">${tile('var(--s1)',ico('upload'))}<span class="row-m"><span class="row-t">Importar copia</span><span class="row-s">Recupera tus datos desde un archivo</span></span>${ico('chevR','chev')}</label>
    </div><input type="file" id="simp" accept=".json,application/json" hidden><div id="sout"></div></div>
    ${auto?`<div class="sec"><h4 class="lab">Pagos con tarjeta</h4><div class="group"><button class="row" id="sauto">${tile('var(--s7)',ico('bolt'))}<span class="row-m"><span class="row-t">Apuntar pagos automáticamente</span><span class="row-s">${aOn?'Activado':'Desactivado'}</span></span>${ico('chevR','chev')}</button></div></div>`:''}
    <div class="sec"><h4 class="lab">Datos de ejemplo</h4><div class="group">${hasExamples()?`<button class="row" id="sclr">${tile('var(--s4)',ico('sparkle'))}<span class="row-m"><span class="row-t">Borrar datos de ejemplo</span><span class="row-s">Tus datos reales se mantienen</span></span></button>`:`<button class="row" id="ssam">${tile('var(--s4)',ico('sparkle'))}<span class="row-m"><span class="row-t">Cargar datos de ejemplo</span><span class="row-s">Para ver cómo funciona la app</span></span></button>`}</div></div>
    <div class="group"><button class="row danger" id="sall">${tile('var(--s8)',ico('trash'))}<span class="row-m"><span class="row-t">Borrar todos mis datos</span><span class="row-s" id="sallsub">Se borra todo lo que has apuntado</span></span></button></div>
    <p class="foot">Cuentas Claras 2.0. Las cantidades se muestran en euros.</p>`);
  $('#sexp').onclick=exportData;
  const sa=$('#sauto');if(sa)sa.onclick=autoSheet;
  $('#simp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f)};
  const ss=$('#ssam');if(ss)ss.onclick=()=>{closeSheet();setTimeout(loadSample,200)};
  const sc=$('#sclr');if(sc)sc.onclick=()=>{closeSheet();setTimeout(clearExamples,200)};
  const sall=$('#sall');let armed=false,armT=null;
  sall.onclick=()=>{if(!armed){armed=true;haptic('warn');$('#sallsub').textContent='Toca otra vez para borrarlo todo';sall.style.background=cssv('--crit-soft');clearTimeout(armT);armT=setTimeout(()=>{armed=false;const s=$('#sallsub');if(s)s.textContent='Se borra todo lo que has apuntado';sall.style.background=''},3500);return}
    const snap=JSON.stringify({config:state.config,months:state.months});const old=Object.keys(state.months);state.config=defaultConfig();state.months={};saveConfig();old.forEach(saveMonth);haptic('reject');closeSheet();
    setTimeout(()=>{refresh();toast('Datos borrados',{action:()=>{const o=JSON.parse(snap);state.config=o.config;state.months=o.months;saveConfig();Object.keys(state.months).forEach(saveMonth);refresh()}})},150)};
}
async function exportData(){
  const json=JSON.stringify({app:'cuentas-claras',v:1,exportado:new Date().toISOString(),config:state.config,months:state.months});
  const name=`cuentas-claras-${todayStr()}.json`;
  if(ANDROID&&ANDROID.saveFile){ANDROID.saveFile(name,json);return}
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data:json});toast('Copia guardada')}catch(e){if(e&&e.code!=='declined')showJson(json)}return}
  showJson(json);
}
function showJson(json){const o=$('#sout');if(!o)return;o.innerHTML=`<div class="field" style="margin-top:12px"><label for="sjson">Copia este texto y guárdalo en un archivo .json</label><textarea class="inp" id="sjson" readonly></textarea><button class="btn" id="scopy">Copiar</button></div>`;
  $('#sjson').value=json;$('#scopy').onclick=async()=>{try{await navigator.clipboard.writeText(json);toast('Copiado')}catch(e){$('#sjson').select()}}}
function importData(text){
  try{const o=JSON.parse(text);if(!o||o.app!=='cuentas-claras'||!o.config)throw 0;
    const old=Object.keys(state.months);state.config=Object.assign(defaultConfig(),o.config);state.months=o.months||{};
    saveConfig();new Set([...old,...Object.keys(state.months)]).forEach(saveMonth);closeSheet();setTimeout(()=>{refresh();toast('Copia importada')},150)}
  catch(e){toast('Ese archivo no es una copia de Cuentas Claras')}
}
window.__cuentasImport=importData;
window.__cuentasBack=()=>{if(sheetOpen){closeSheet();return true}if(view!=='resumen'){viewYM=curYM();go('resumen');return true}if(viewYM!==curYM()){act('today');return true}return false};

function loadSample(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const c=state.config;const cur=curYM();const td=todayStr();
  if(!c.budget){c.budget=1800;c.exBudget=true}
  const find=(id,name)=>c.cats.find(x=>x.id===id)||c.cats.find(x=>x.name===name)||c.cats[0];
  const cV=find('viv','Vivienda').id,cS=find('super','Supermercado').id,cR=find('rest','Restaurantes').id,cT=find('trans','Transporte').id,cO=find('ocio','Ocio').id,cH=find('salud','Salud').id,cU=find('subs','Suscripciones').id,cX=find('otros','Otros gastos').id;
  const start=addYM(cur,-5);
  c.fixed.push({id:newId(),name:'Alquiler',amt:750,day:1,cat:cV,start,ex:true},{id:newId(),name:'Luz y agua',amt:68.4,day:6,cat:cV,start,ex:true},{id:newId(),name:'Gimnasio',amt:39.9,day:5,cat:cH,start,ex:true},{id:newId(),name:'Móvil e internet',amt:45,day:10,cat:cU,start,ex:true},{id:newId(),name:'Plataformas de vídeo',amt:13.99,day:15,cat:cU,start,ex:true});
  const lim={[cS]:300,[cR]:150,[cO]:120};for(const k in lim){const cc=catById(k);if(cc&&!cc.limit){cc.limit=lim[k];cc.exLim=true}}
  const nom=(c.incCats[0]||{}).id;
  const plan=[[cS,'Compra semanal',45,85,4],[cR,'Cena fuera',18,45,3],[cR,'Café y desayuno',3,9,5],[cT,'Gasolina',40,60,2],[cT,'Abono transporte',20,20,1],[cO,'Cine',9,18,1],[cO,'Concierto',25,45,0.4],[cH,'Farmacia',6,25,1],[cX,'Regalo',20,50,0.5],[cS,'Mercado',12,30,2]];
  for(let k=5;k>=0;k--){const ym=addYM(cur,-k);const days=dim(ym);const lastDay=ym===cur?+td.slice(8):days;const arr=state.months[ym]=state.months[ym]||[];
    if(lastDay>=1&&nom)arr.push({id:newId(),t:'i',amt:2150,cat:nom,d:`${ym}-01`,note:'Nómina',ts:Date.now(),ex:true});
    if(k%2===0&&c.incCats[1])arr.push({id:newId(),t:'i',amt:r2(150+rnd()*250),cat:c.incCats[1].id,d:`${ym}-${pad(Math.min(lastDay,14))}`,note:'Proyecto freelance',ts:Date.now(),ex:true});
    for(const[cat,note,lo,hi,times]of plan){let n=Math.floor(times*(0.7+rnd()*0.6)+rnd());
      for(let j=0;j<n;j++){const d=1+Math.floor(rnd()*lastDay);arr.push({id:newId(),t:'g',amt:r2(lo+rnd()*(hi-lo)),cat,d:`${ym}-${pad(d)}`,note,ts:Date.now(),ex:true})}}
  }
  const mk2=(name,type,startK,monthly,growth,vol)=>{const e=[];let val=0;for(let k=startK;k>=0;k--){const ym=addYM(cur,-k);const d1=`${ym}-02`;if(d1>td)break;e.push({k:'a',amt:monthly,d:d1});val=(val+monthly)*(1+growth+(rnd()-0.5)*vol);const de=k===0?td:`${ym}-${pad(dim(ym))}`;e.push({k:'v',amt:r2(val),d:de})}return{id:newId(),name,type,e,ex:true}};
  c.inv.push(mk2('Fondo indexado mundial',0,11,200,0.008,0.05),mk2('Bitcoin',3,7,50,0.01,0.22));
  c.inv.push({id:newId(),name:'Cuenta remunerada',type:4,ex:true,e:[{k:'a',amt:3000,d:`${addYM(cur,-8)}-01`},{k:'v',amt:3067.5,d:td}]});
  saveConfig();Object.keys(state.months).forEach(saveMonth);refresh();toast('Datos de ejemplo cargados');
}
function clearExamples(){
  const c=state.config;if(c.exBudget){c.budget=0;c.exBudget=false}
  c.fixed=c.fixed.filter(f=>!f.ex);c.inv=c.inv.filter(i=>!i.ex);
  for(const cc of c.cats){if(cc.exLim){cc.limit=0;delete cc.exLim}}
  const touched=[];for(const ym in state.months){const n=state.months[ym].filter(t=>!t.ex);if(n.length!==state.months[ym].length){state.months[ym]=n;touched.push(ym)}}
  if(c.ack)c.ack={};
  saveConfig();touched.forEach(saveMonth);refresh();toast('Ejemplo borrado');
}

/* ---------- arranque ---------- */
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{measureDigits();$$('.odo-col').forEach(c=>c.style.width=digitW[+c.dataset.to].toFixed(4)+'em');indX=null;if(ready)moveIndicator()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ready&&lastMonthShown&&viewYM!==curYM()&&view!=='resumen'&&view!=='movs'){viewYM=curYM()}});
initStorage();
})();
